<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atmosphere | Real-Time Weather</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-wrapper">
        <div class="search-box">
            <input type="text" id="cityInput" placeholder="Enter city name..." autocomplete="off">
            <button id="searchBtn">Check Weather</button>
        </div>

        <div id="weatherDisplay" class="weather-card hidden">
            <h2 id="cityName">--</h2>
            <div class="temp-container">
                <span id="temperature">0</span>°C
            </div>
            <p id="description" class="description">--</p>
            <div class="details">
                <div class="col">
                    <p>Humidity</p>
                    <span id="humidity">0</span>%
                </div>
                <div class="col">
                    <p>Wind Speed</p>
                    <span id="windSpeed">0</span> km/h
                </div>
            </div>
        </div>
        <div id="errorMessage" class="error-msg hidden"></div>
    </div>
    <script src="app.js"></script>
</body>
</html>
